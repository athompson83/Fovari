appId: com.fovari.mobile.dev
name: Fovari synthetic family setup and identity
---
- launchApp:
    clearState: true
- assertVisible: "Fovari"
- tapOn: "Create a family account"
- assertVisible: "Set up your family"
- tapOn: "Your display name"
- inputText: "Morgan"
- tapOn: "Continue"
- tapOn: "Family name"
- inputText: "The Park Family"
- tapOn: "Continue"
- tapOn: "Child name"
- inputText: "Maya"
- tapOn: "Explorer"
- tapOn: "Use a PIN"
- tapOn: "Child PIN"
- inputText: "2468"
- tapOn: "Add child"
- tapOn: "Continue"
- tapOn: "Read together"
- tapOn: "Continue"
- tapOn: "Family movie night"
- tapOn: "Continue"
- tapOn: "Continue"
- assertVisible: "Review your family setup"
- tapOn: "Create my family"
- assertVisible: "Good morning, Morgan.*"
- assertVisible: "The Park Family"
- tapOn: "Hand off to Maya"
- assertVisible: "Who is using Fovari?"
- tapOn: "Choose Maya"
- tapOn: "Maya PIN"
- inputText: "0000"
- tapOn: "Open Maya's space"
- assertVisible: "That PIN does not match. 2 tries left."
- tapOn: "Maya PIN"
- inputText: "2468"
- tapOn: "Open Maya's space"
- assertVisible: "Hi, Maya!"
- assertVisible: "Read together"
- assertVisible: "Family movie night"
- tapOn: "Open parent gate"
- tapOn: "Parent gate answer"
- inputText: "12"
- tapOn: "Unlock grown-up controls"
- assertVisible: "Good morning, Morgan.*"
- tapOn: "Hand off to Maya"
- assertVisible: "Who is using Fovari?"
